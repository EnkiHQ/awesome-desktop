# Project metadata for awesome-desktop.
#
# `pip install` / `uv tool install` gives the cross-platform desktop pet (`awesome-pet`).
# The Windows billiards executable is still produced by PyInstaller through build.ps1.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-desktop"
description = "Desktop toys: icon billiards and a desktop character that types when you type."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LXG" }, { name = "EnkiHQ" }]
keywords = ["desktop", "pet", "billiards", "keyboard", "mouse", "game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=10",
    "numpy>=1.24",
    "PySide6-Essentials>=6.6",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pynput>=1.7.6; sys_platform != 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]
dynamic = ["version"]

[project.scripts]
awesome-pet = "pet.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["dib", "arcade", "pet"]
include-package-data = false

[tool.setuptools.package-data]
pet = ["assets/*/*.png", "assets/*/*.json"]

[tool.setuptools.dynamic]
version = { attr = "pet.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
